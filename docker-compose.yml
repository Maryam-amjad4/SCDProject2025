services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - nodevault-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodevault
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - nodevault-network
    ports:
      - "3000:3000"

volumes:
  mongo-data:

networks:
  nodevault-network:

